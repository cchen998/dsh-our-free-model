name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    # 每天 UTC 0点（北京时间早上8点）自动同步一次
    - cron: "0 0 * * *"
  workflow_dispatch: # 支持在 Actions 页面手动点击运行

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream
    runs-on: ubuntu-latest
    # 仅在 Fork 仓库中运行，防止误触发
    if: github.event.repository.fork

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Sync upstream changes
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          target_sync_branch: 'main'
          upstream_sync_repo: 'Ebony-Vinyl/dsh-our-free-model'
          upstream_sync_branch: 'main'
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          # 避免因上游代码历史分叉导致推送失败
          target_branch_push_args: '--force'
